name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run setup
      - run: npm test -- --runInBand
      - run: npm run package
      - name: Verify versioned ZIP exists and is non-empty
        run: |
          ZIP="dist/drag-to-sheets-$(node -e "console.log(require('./manifest.json').version)").zip"
          test -f "$ZIP"
          test -s "$ZIP"
          echo "ZIP OK: $ZIP ($(du -h "$ZIP" | cut -f1))"
